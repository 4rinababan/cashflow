name: cashflow
description: "Cashflow — track income and expenses, with AI receipt scanning."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  dio: ^5.4.3
  intl: ^0.19.0
  flutter_secure_storage: ^9.0.0
  image_picker: ^1.1.0
  fl_chart: ^0.68.0
  http_parser: ^4.0.2
  shared_preferences: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/icon/icon.png

# Generates the Android/iOS launcher icon from assets/icon/icon.png (Phase
# 8 store readiness — see docs/store-listing.md). Run after `flutter pub
# get`: `dart run flutter_launcher_icons`. Regenerates native icon files
# under android/ and ios/, which are not otherwise hand-maintained.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  # The App Store rejects an icon with an alpha channel; Play Store doesn't
  # care, but flattening it once here keeps one icon good for both.
  remove_alpha_ios: true

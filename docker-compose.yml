services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cashflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cashflow_local_dev}
      POSTGRES_DB: ${POSTGRES_DB:-cashflow}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - cashflow-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cashflow}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: ${PORT:-8080}
      ENV: ${ENV:-development}
      DATABASE_URL: postgres://${POSTGRES_USER:-cashflow}:${POSTGRES_PASSWORD:-cashflow_local_dev}@postgres:5432/${POSTGRES_DB:-cashflow}?sslmode=disable
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:-}
      AI_ENDPOINT: ${AI_ENDPOINT:-https://generativelanguage.googleapis.com/v1beta/openai}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-gemini-flash-latest}
      RECEIPT_SCAN_DAILY_LIMIT_PER_USER: ${RECEIPT_SCAN_DAILY_LIMIT_PER_USER:-10}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_ADDRESS: ${SMTP_FROM_ADDRESS:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Cashflow}
      SMTP_IMPLICIT_TLS: ${SMTP_IMPLICIT_TLS:-}
      APP_BASE_URL: ${APP_BASE_URL:-https://app.cashflow.example}
    ports:
      - "${PORT:-8080}:8080"

volumes:
  cashflow-pgdata:

name: Release Android

# Manual only — a Play Store release is never something to build on every
# push. Triggered from the Actions tab (or `gh workflow run release-android.yml`).
# See docs/ops/play-store-release.md for the full walkthrough, including the
# one-time setup this depends on (an upload keystore only you hold, added as
# repo secrets below).
on:
  workflow_dispatch: {}

jobs:
  build-aab:
    name: Build signed App Bundle
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: flutter pub get
        run: flutter pub get

      - name: Decode signing keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore

      - name: Write key.properties
        # Never echoed — GitHub masks registered secret values in logs, and
        # this file is git-ignored (mobile/.gitignore) so it never persists
        # past this job.
        run: |
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=app/release.keystore
          EOF

      - name: flutter build appbundle --release
        run: >
          flutter build appbundle --release
          --dart-define=API_BASE_URL=${{ vars.API_BASE_URL || 'https://api.laburaku.com' }}

      - name: Upload App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: cashflow-release-aab
          path: mobile/build/app/outputs/bundle/release/app-release.aab
          retention-days: 90
